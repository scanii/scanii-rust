name: Release

# Triggered by Rafael publishing the GitHub Release (UI or `gh release create`).
# This workflow does NOT create the release — it only publishes the crate to
# crates.io.
#
# crates.io publishes are IRREVERSIBLE. `cargo yank` exists but the version
# number is permanently burned. PR CI is the gate for catching issues before
# this workflow ever runs.

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # cargo publish reads the version from Cargo.toml, not from the tag. When
      # the two disagree the publish either pushes the wrong version or — as in
      # v1.4.0 — fails with "already exists on crates.io index" after the
      # GitHub Release has already been created. Fail loudly and early instead.
      - name: Verify Cargo.toml version matches the release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MANIFEST=$(grep -m1 '^version *= *"' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "v$MANIFEST" != "$TAG" ]; then
            echo "::error::Cargo.toml version ($MANIFEST) does not match release tag ($TAG). Bump Cargo.toml and re-cut the release."
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not configured in repo settings"
            exit 1
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
